name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:modules
      - run: npm run test:core
      - run: npm run test:wire
      - run: npm run build
      - run: npm run dist
      - run: npm run test:packaged-ui
      - run: npm run dist:installer
      - run: npm run test:installer
